<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e9edf0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Mô phỏng Chrome trên iPhone 12 mini</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;font-family:Arial,sans-serif}
    body{display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#f8fafb,#d9dfe4)}
    .stage{width:391px;height:828px;position:relative}.device{transform:scale(var(--device-scale,1));transform-origin:top left}
    .device{width:391px;height:828px;padding:8px;border:1px solid #3b4045;border-radius:49px;background:#16191c;box-shadow:0 24px 70px #1e293344}
    .screen{position:relative;width:375px;height:812px;border-radius:40px;overflow:hidden;background:#fdf7e5;display:grid;grid-template-rows:30px 78px 640px 64px}
    .status{display:flex;align-items:center;justify-content:space-between;padding:2px 20px 0;color:#111;font-size:15px;font-weight:700;background:#fff}
    .status-icons{font-size:13px;letter-spacing:1px}
    .chrome-top{background:#fff;padding:5px 14px 9px}
    .browser-row{height:46px;display:grid;grid-template-columns:30px minmax(0,1fr) 22px;align-items:center;gap:4px}
    .back,.more{font-size:21px;text-align:center;color:#737d82}.more{font-size:20px;letter-spacing:1px}
    .address{height:46px;display:flex;align-items:center;gap:7px;padding:0 9px;border-radius:25px;background:#e7e9ed;color:#111;min-width:0}
    .address input{flex:1;min-width:0;width:0;border:0;outline:0;background:transparent;text-align:center;font:14px Arial,sans-serif;color:#111}
    .address:focus-within{box-shadow:inset 0 0 0 2px #8ab4f8}
    .address button{width:26px;height:30px;border:0;border-radius:50%;background:transparent;color:#59666d;font-size:20px;cursor:pointer}
    .game-frame{width:375px;height:640px;border:0;display:block;background:#fdf7e5}
    .toolbar{display:flex;align-items:center;justify-content:space-around;padding:3px 9px 5px;background:#242322;color:#fff}
    .tool{display:flex;align-items:center;flex-direction:column;gap:3px;font-size:10px}.tool b{font-size:20px;font-weight:500}
    .home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:112px;height:4px;border-radius:5px;background:#fff}
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="device"><div class="screen">
      <div class="status"><span>13:41</span><span class="status-icons">▮▮▮ ◉ ▰</span></div>
      <div class="chrome-top"><div class="browser-row">
        <span class="back">‹</span>
        <form class="address" id="address-form"><input id="address-input" aria-label="Địa chỉ trang web hoặc tệp HTML" value="game.html" autocomplete="off" spellcheck="false"><button type="submit" aria-label="Mở địa chỉ">↵</button></form>
        <span class="more">•••</span>
      </div></div>
      <iframe class="game-frame" id="game-frame" src="game.html" title="Mô phỏng trang web trên iPhone 12 mini"></iframe>
      <div class="toolbar"><span class="tool"><b>✦</b><span>Hỏi Gemini</span></span><span class="tool"><b>⊕</b><span>Thẻ mới</span></span><span class="tool"><b>▣</b><span>Tất cả thẻ</span></span></div>
      <div class="home-indicator"></div>
    </div></div>
  </div>
  <script>
    const stage=document.getElementById('stage');
    function fit(){const scale=Math.max(.4,Math.min((innerWidth-36)/391,(innerHeight-36)/828,1));stage.style.width=(391*scale)+'px';stage.style.height=(828*scale)+'px';document.querySelector('.device').style.setProperty('--device-scale',scale)}
    addEventListener('resize',fit);fit();
    document.getElementById('address-form').addEventListener('submit',event=>{
      event.preventDefault();
      const input=document.getElementById('address-input');
      const raw=input.value.trim();
      if(!raw)return;
      let target;
      if(/^[a-z]:[\\/]/i.test(raw)) target='file:///'+encodeURI(raw.replace(/\\/g,'/'));
      else if(/^[a-z][a-z0-9+.-]*:/i.test(raw)) target=raw;
      else if(!raw.includes('/')&&!raw.includes('\\')&&raw.includes('.')&&!raw.toLowerCase().endsWith('.html')) target='https://'+raw;
      else target=new URL(raw,window.location.href).href;
      document.getElementById('game-frame').src=target;
      input.blur();
    });
  </script>
</body>
</html>
